<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A85E"/>
      <stop offset="50%" style="stop-color:#C8A87C"/>
      <stop offset="100%" style="stop-color:#B8944A"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D5B0"/>
      <stop offset="100%" style="stop-color:#C8A87C"/>
    </linearGradient>
  </defs>
  <!-- Scissors - left blade -->
  <path d="M34 32 L52 12" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Scissors - right blade -->
  <path d="M34 32 L52 52" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Scissors pivot -->
  <circle cx="34" cy="32" r="4.5" fill="url(#gold)"/>
  <circle cx="34" cy="32" r="2" fill="#1a1a1a"/>
  <!-- Scissors handle - left ring -->
  <ellipse cx="18" cy="18" rx="8" ry="6" fill="none" stroke="url(#blade)" stroke-width="3" transform="rotate(-40 18 18)"/>
  <!-- Scissors handle - right ring -->
  <ellipse cx="18" cy="46" rx="8" ry="6" fill="none" stroke="url(#blade)" stroke-width="3" transform="rotate(40 18 46)"/>
  <!-- Stylish slash accent -->
  <line x1="42" y1="22" x2="58" y2="16" stroke="#D4A85E" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <line x1="42" y1="42" x2="58" y2="48" stroke="#D4A85E" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
</svg>
